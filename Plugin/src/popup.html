<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>代理快速切换</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true"></span>
          <div class="brand__text">
            <h1 class="brand__title">代理快速切换</h1>
            <p class="brand__subtitle">浏览器直连你的代理服务器</p>
          </div>
        </div>
        <span id="badge" class="badge badge--off">已关闭</span>
      </header>

      <!-- 连接状态：用户最关心的一行，单独突出显示 -->
      <section id="connCard" class="conn conn--idle">
        <span id="connDot" class="conn__dot" aria-hidden="true"></span>
        <div class="conn__text">
          <strong id="connText" class="conn__title">未开启</strong>
          <small id="connHint" class="conn__hint">打开下面的开关即可让浏览器走代理</small>
        </div>
      </section>

      <!-- 主开关 -->
      <button
        id="toggle"
        class="toggle"
        type="button"
        role="switch"
        aria-checked="false"
        aria-labelledby="toggleTitle"
      >
        <span class="toggle__track" aria-hidden="true">
          <span class="toggle__thumb"></span>
        </span>
        <span class="toggle__text">
          <strong id="toggleTitle" class="toggle__title">代理已关闭</strong>
          <small id="toggleHint" class="toggle__hint">点击开启代理</small>
        </span>
      </button>

      <section class="rows" aria-label="代理信息">
        <div class="row">
          <span class="row__label">代理服务器</span>
          <span id="server" class="row__value row__value--mono">未配置</span>
        </div>
        <div class="row">
          <span class="row__label">认证</span>
          <span id="authText" class="row__value">未启用</span>
        </div>
        <div class="row">
          <span class="row__label">出口 IP</span>
          <span id="exitIp" class="row__value row__value--mono">—</span>
        </div>
        <div class="row">
          <span class="row__label">最近检测</span>
          <span id="probeAt" class="row__value row__value--muted">—</span>
        </div>
      </section>

      <p id="notice" class="notice" hidden></p>

      <footer class="footer">
        <button id="openOptions" class="btn btn--primary" type="button">打开设置</button>
        <button id="refresh" class="btn" type="button">重新检测</button>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
